<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="logo.png">
        <link rel="stylesheet" href="style.css">
        <title>Bounce Ball Game</title>
    </head>
    <body>
        <div id="overlay">
        <div id="message-box">
            <h1 id="msg-title">Bounce Ball</h1>
            <p id="msg-score">Are you ready to play?</p>
            <button id="start-btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="game-container">
        <h1 class="game-title">Bounce Ball</h1>
        
        <canvas id="game" width="800" height="550"></canvas>
        
        <div class="controls-info">
            <span class="icon">🖱️ / 👆</span> 
            <span>Controls: Drag your finger or mouse to move the bar!</span>
        </div>
    </div>

        <script src="index.js"></script>
    </body>
</html>
