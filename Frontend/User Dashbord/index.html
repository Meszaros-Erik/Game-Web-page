<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="website icon" type="png" href="../image/logo.png">     
        <title>User Dashboard</title>

        <!-- CSS file link -->
        <link rel="stylesheet" href="../CSS & Js code path/global.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <input type="checkbox" name="" id="toggler">
            <div class="bx bx-menu" id="menu-btn"></div>
            <a href="/index.html" class="logo"><img src="../image/logo.png">Hello <span>User!</span></a>
            <nav class="navbar">
                <a href="#profile">Profile settings</a>
                <a href="#user-scores">My Scores</a>
            </nav>

            <div class="header-icons">
                <div class="toggle" id="darkModeBtn">
                    <i class="bx bx-moon toggle-icon"></i>
                </div>

                <div id="auth-container" class="auth-container">
                    <a href="../Login & Registration/index.html" class="btn" id="loginBtn">Login</a>

                    <div class="user-profile" id="userProfile" style="display: none;">
                        <div class="profile-trigger" id="profileTrigger">
                            <img src="" alt="Profile" class="profile-img" id="profileImg">
                            <span class="profile-name" id="profileName">Username</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="#" id="logoutBtn" style="color: var(--error-color);"><i class='bx bx-log-out'></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>  
        </header>

        <!-- Profile Modify Section -->
        <section class="user-section" id="profile">
            <h2 class="section-title"><i class='bx bx-user-circle'></i> Profile Settings</h2>
            
            <div class="profile-main-grid" style="display: grid; grid-template-columns: 250px 1fr; gap: 40px; align-items: start;">
                
                <!-- Profile Picture Upload -->
                <div class="profile-pic-side" style="text-align: center;">
                    <img src="" id="userProfileImg" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover;">
                    <div class="change-pic-btn" onclick="document.getElementById('picFile').click()" style="margin-top: 15px; cursor: pointer; color: var(--main-color);">
                        <i class='bx bx-camera'></i> Change Picture
                    </div>
                    <input type="file" id="picFile" style="display:none;">
                </div>

                <div class="profile-fields-side">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="editUsername" class="item" value="Anna">
                    </div>

                    <div class="password-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="input-group">
                            <label>Current Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="oldPassword" class="item" placeholder="Old Password">
                                <i class='bx bx-hide' id="toggleOld"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>New Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="newPassword" class="item" placeholder="New Password">
                                <i class='bx bx-hide' id="toggleNew"></i>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn btn-save" onclick="saveProfileChanges()" style="width: 100%; margin-top: 20px;">Save Changes</button>
                </div>
            </div>
        </section>

        <!-- Scores Section -->
        <section class="user-section" id="user-scores">
            <h2 class="section-title"><i class='bx bx-trophy'></i> My Best Scores</h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
                            <th>Game Title</th>
                            <th>Level</th>
                            <th>Score</th>
                            <th>Duration</th>
                            <th>Rank</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="userScoresBody"></tbody>
                </table>
            </div>
            <div class="action-buttons">
                <button class="btn btn-delete" onclick="handleDeleteAction()"><i class='bx bx-trash'></i> Delete Score</button>
            </div>
        </section>

        <div id="customConfirmModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <p id="modalMessage">Are you sure you want to delete this score?</p>
                <div class="modal-actions">
                    <button id="btnCancel">Cancel</button>
                    <button id="btnConfirm">Yes</button>
                </div>
            </div>
        </div>

        <div id="toast-container"></div>

        <!-- JS file link -->
        <script src="script.js"></script>
        <script src="../CSS & Js code path/global functions.js"></script>
    </body>
</html>
