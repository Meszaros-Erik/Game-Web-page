<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
        <link rel="website icon" type="png" href="spin logo.png">
        <link rel="stylesheet" href="style.css">
        <title>Spin Wheel App</title>
    </head>
    <body>
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <h3>Settings</h3>
                <label for="slice-count">Number of slices (2-100):</label>
                <input type="number" id="slice-count" min="2" max="100" value="6">
                <button id="apply-settings">Apply</button>
            </div>
        </div>

        <div class="wrapper">
            <div class="container">
                <canvas id="wheel"></canvas>
                <button id="spin-btn">Spin</button>
                <img src="spinner-arrow.svg" alt="">
            </div>
            <div id="final-value">
                <p>Click on spin button to start</p>
            </div>
            <button id="reset-btn">Reset</button>
        </div>

        <!-- Chart JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
        
        <!-- Chart JS Plugin for displaying text over chart -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js"></script>
        <script src="index.js"></script>
    </body>
</html>
