<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="website icon" type="png" href="../image/logo.png">  
        <title>Wishlist</title>

        <!-- CSS file link -->
        <link rel="stylesheet" href="../CSS & Js code path/global.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <a href="../index.html" class="logo">
                <img src="../image/logo.png" alt="Logo">Game<span>.</span>
            </a>

            <div class="header-icons">
                <div class="toggle" id="darkModeBtn">
                    <i class="bx bx-moon toggle-icon"></i>
                </div>

                <div id="auth-container" class="auth-container">
                    <a href="../Login & Registration/index.html" class="btn" id="loginBtn">Login</a>

                    <div class="user-profile" id="userProfile" style="display: none;">
                        <div class="profile-trigger" id="profileTrigger">
                            <img src="../image/Robot-avatar.png" alt="Profile" class="profile-img">
                            <span class="profile-name" id="profileName">Username</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>

                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="#" id="dashboardLink"><i class='bx bx-grid-alt'></i> Dashboard</a>
                            <a href="#" id="logoutBtn" style="color: var(--error-color);"><i class='bx bx-log-out'></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="first-page" id="first-page">
            <div class="content" id="empty-wishlist-message">
                <h3>Wishlist</h3>
                <p>
                    Your wishlist does not contain any games. 
                    To add games to your wishlist, please return to the games page.
                </p>
                <a href="../index.html#games" class="btn">Go to Games</a>
            </div>
            
            <h1 class="heading" id="wishlist-heading" style="display: none;">Favorite <span>Games</span></h1>
            <div class="wishlist-grid" id="wishlist-grid" style="display: none;"></div>
        </section>

        <!-- JS file link -->
        <script src="../CSS & Js code path/global functions.js"></script>
        <script src="script.js"></script>
    </body>
</html>
